# Chezmoi External Dependencies
# Manages Oh-My-Zsh, its plugins, and the tmux plugin set (TPM included)
# Run `chezmoi apply` to install/update these
#
# Every pin is a default-branch commit SHA plus the matching sha256, refreshed
# by scripts/update-versions.sh (the weekly updater PR re-resolves HEAD,
# rewrites the URLs, and recomputes the checksums). No refreshPeriod anywhere:
# the URL carries the version, so re-fetching an immutable archive is waste.
# zsh-z was removed 2026-09-24: never loaded (no plugins= entry), zoxide owns `z`.

[".oh-my-zsh"]
  type = "archive"
  url = "https://github.com/ohmyzsh/ohmyzsh/archive/74965c96098134b192f00084f966b4b02438a739.tar.gz"
  # exact = false on purpose: oh-my-zsh owns this tree (its own updater plus
  # everything under custom/); chezmoi must not prune files it did not ship.
  exact = false
  stripComponents = 1
  checksum.sha256 = "6c198596500d9701ac42f7be894fae38ebc6b4140f649693c16c4ca061b3ad50"

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
