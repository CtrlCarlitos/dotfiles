# Chezmoi External Dependencies
# Manages Oh-My-Zsh and its plugins
# Run `chezmoi apply` to install/update these
#
# Version Pinning (updated 2026-02-27)
# Using commit hashes instead of tags for better stability, security, and to avoid GitHub tag archive 502 errors.

