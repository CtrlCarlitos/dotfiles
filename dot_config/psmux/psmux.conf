#===============================================================================
# PSMUX CONFIGURATION - the Windows twin of ~/.tmux.conf
#===============================================================================
# psmux (Chocolatey "psmux") is a native Windows tmux: ConPTY, the tmux
# command language, tmux-compatible config. This file mirrors dot_tmux.conf's
# portable subset - tests/psmux_contract.sh asserts the shared lines VERBATIM
# in both files, so a binding changed in one fails the suite until it is
# changed in the other.
#
# psmux config search order: ~/.psmux.conf, ~/.psmuxrc, ~/.tmux.conf,
# ~/.config/psmux/psmux.conf. On Windows ~/.tmux.conf is chezmoi-ignored
# (nothing tmux runs there), so this file is the one that loads.
#
# Deliberately NOT mirrored from dot_tmux.conf (see tests/psmux_contract.sh):
#   TPM + resurrect/continuum plugins   - psmux has no plugin manager; its
#                                         server already keeps sessions alive
#                                         across detaches
#   clip.exe/xclip/wl-copy/pbcopy pipes - psmux yank reaches the Windows
#                                         clipboard directly (OSC 52 below)
#   default-terminal + terminal-overrides - ConPTY negotiates this itself
#
# Launch it from the "psmux" Windows Terminal profile, which starts in
# %USERPROFILE% - never as a bare commandline override (that lands in
# C:\Windows\System32 and starship's directory scan times out on every prompt).

#-------------------------------------------------------------------------------
# General Settings
#-------------------------------------------------------------------------------
# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Don't wait for escape sequences - the agent CLIs' Esc and Esc Esc must feel
# like they do in a bare tab (psmux's 500 ms default is why Esc felt dead).
set -s escape-time 0

# Focus events for vim
set -g focus-events on

# psmux panes run PowerShell 7, like the Windows Terminal profiles.
set -g default-shell pwsh

#-------------------------------------------------------------------------------
# Key Bindings
#-------------------------------------------------------------------------------
# Change prefix from Ctrl-b to Ctrl-a (easier to reach) - same as tmux
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config with prefix + r
bind r source-file ~/.config/psmux/psmux.conf \; display "Config reloaded!"

# Split panes with | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Shift + arrow
bind -n S-Left previous-window
bind -n S-Right next-window

# Move windows with Ctrl + Shift + arrow
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

#-------------------------------------------------------------------------------
# Copy Mode (vim-like)
#-------------------------------------------------------------------------------
setw -g mode-keys vi

# Start selection with v, yank with y
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# OSC 52: every copy is also sent to the OUTER terminal. Windows Terminal
# accepts OSC 52 writes, so a yank in psmux lands on the Windows clipboard -
# the same route tmux uses over SSH.
set -s set-clipboard on

# Paste detection OFF: psmux otherwise intercepts Ctrl+V itself, reads the
# clipboard and re-injects it through its own channel - which strips the
# first escape bytes (pastes into OpenCode/Claude arrived prefixed with a
# literal "[A") and has deadlocked the pane entirely on a TUI paste (no
# reaction even to Ctrl+C). Windows Terminal pastes natively; with detection
# off psmux just relays the bytes and the TUI's own bracketed paste does the
# rest. Upstream: psmux#719.
set -g paste-detection off

#-------------------------------------------------------------------------------
# Status Bar (Catppuccin Mocha - same hexes as dot_tmux.conf)
#-------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left side: session name
set -g status-left-length 30
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[bg=#1e1e2e] "

# Right side: date and time
set -g status-right-length 50
set -g status-right "#[fg=#a6adc8] %Y-%m-%d #[fg=#cdd6f4,bold]%H:%M "

# Window tabs
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

#-------------------------------------------------------------------------------
# Cheatsheet (prefix = Ctrl+a) - identical to tmux; docs/tmux.md explains each
#-------------------------------------------------------------------------------
# prefix + |     Split side by side
# prefix + -     Split top/bottom
# prefix + hjkl  Navigate panes
# prefix + c     New window
# prefix + n/p   Next/previous window
# prefix + d     Detach
# prefix + [     Copy mode (v select, y copy -> Windows clipboard)
# prefix + r     Reload config
