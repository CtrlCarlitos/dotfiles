# Pre-commit hooks for dotfiles security
# Install: pip install pre-commit && pre-commit install

repos:
  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  # Check for common security issues in shell scripts.
  # types: [file] + files: the previous default (types: [shell]) never
  # matched anything but plain *.sh, and quietly skipped everything else the
  # CI loop lints (#131). *.sh.tmpl stays CI-only: a raw template does not
  # parse as shell until its {{...}} actions are stripped, which only the CI
  # loop does. --shell=bash: dot_aliases.zsh has no shebang (it is sourced)
  # and shellcheck has no zsh dialect; SC2148 (missing shebang) is by design.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        types: [file]
        files: \.(sh|zsh)$|^dot_local/bin/executable_[^/]+$
        args: ["-e", "SC1091", "-e", "SC2148", "--shell=bash"]

  # Validate TOML files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
