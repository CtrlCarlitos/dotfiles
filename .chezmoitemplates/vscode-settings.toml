# VS Code settings - the SEED for chezmoi.toml [data.vscode.settings].
#
# The settings live in each machine's chezmoi.toml, not in the repo: `chezmoi init`
# (which `dot up` runs) writes this seed only when the machine has no
# [data.vscode.settings] yet, and otherwise writes back what the machine has - so an
# edit there survives, and a change here reaches NEW machines only. Edit your own
# settings in ~/.config/chezmoi/chezmoi.toml. The rationale for each key and the tier
# semantics are in docs/vscode.md. Both installers render the tiers from that data:
#   forced    re-asserted on every run; your edit in settings.json is overwritten
#   defaults  written only when the key is absent; your value wins afterwards
#   defaults_windows  the same, Windows only
#   junk      globs merged into files.exclude / search.exclude
#   unset     keys removed from settings.json when present
#   terminal_colors   merged into workbench.colorCustomizations
# A tier you delete is treated as empty.

# The two list tiers come first: in TOML a plain key after a [table] header belongs to that table.
junk  = ["**/__pycache__/**", "**/.venv/**", "**/venv/**", "**/node_modules/**", "**/*.pyc"]
unset = []

[forced]
"editor.fontFamily"                    = "FiraCode Nerd Font"
"editor.fontLigatures"                 = true
"terminal.integrated.fontFamily"       = "MesloLGS Nerd Font Mono"
"terminal.integrated.gpuAcceleration"  = "off"
"remote.SSH.configFile"                = {{ printf "%s/.ssh/vscode_hosts" (.chezmoi.homeDir | replace "\\" "/") | quote }}

[defaults]
"files.autoSave"                               = "afterDelay"
"files.autoSaveDelay"                          = 500
"files.eol"                                    = "\n"
"files.insertFinalNewline"                     = true
"files.trimFinalNewlines"                      = true
"files.trimTrailingWhitespace"                 = true
"explorer.compactFolders"                      = false
"editor.minimap.enabled"                       = false
"editor.wordWrap"                              = "on"
"editor.formatOnSave"                          = true
"diffEditor.ignoreTrimWhitespace"              = false
"diffEditor.wordWrap"                          = "on"
"workbench.startupEditor"                      = "none"
"terminal.integrated.scrollback"               = 30000
"terminal.integrated.shellIntegration.enabled" = true
"terminal.integrated.fontSize"                 = 16
"terminal.integrated.cursorStyle"              = "bar"
"terminal.integrated.commandsToSkipShell"      = ["-workbench.action.toggleSidebarVisibility", "-workbench.action.togglePanel"]
"terminal.integrated.copyOnSelection"          = true
"terminal.integrated.rightClickBehavior"       = "paste"
"cSpell.language"                              = "en,es"

[defaults_windows]
"terminal.integrated.enableWin32InputMode" = true

[terminal_colors]
# Not Catppuccin Mocha's own #1E1E2E: VS Code's built-in Dark Modern theme
# (no workbench.colorTheme override here, so this is the default) uses #181818
# for sideBar.background/panel.background, and a terminal panel lighter than
# the sidebar around it reads as mismatched chrome. Every other terminal_colors
# key stays Catppuccin Mocha.
"terminal.background"          = "#181818"
"terminal.foreground"          = "#CDD6F4"
"terminalCursor.foreground"    = "#F5E0DC"
"terminal.selectionBackground" = "#585B70"
"terminal.ansiBlack"           = "#45475A"
"terminal.ansiRed"             = "#F38BA8"
"terminal.ansiGreen"           = "#A6E3A1"
"terminal.ansiYellow"          = "#F9E2AF"
"terminal.ansiBlue"            = "#89B4FA"
"terminal.ansiMagenta"         = "#F5C2E7"
"terminal.ansiCyan"            = "#94E2D5"
"terminal.ansiWhite"           = "#BAC2DE"
"terminal.ansiBrightBlack"     = "#585B70"
"terminal.ansiBrightRed"       = "#F38BA8"
"terminal.ansiBrightGreen"     = "#A6E3A1"
"terminal.ansiBrightYellow"    = "#F9E2AF"
"terminal.ansiBrightBlue"      = "#89B4FA"
"terminal.ansiBrightMagenta"   = "#F5C2E7"
"terminal.ansiBrightCyan"      = "#94E2D5"
"terminal.ansiBrightWhite"     = "#A6ADC8"
