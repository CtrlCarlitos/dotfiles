# Single source of truth for the agent-guardrails release pin.
#
# Consumed by:
#   - run_onchange_install_packages.sh.tmpl / .ps1.tmpl  (rendered at apply time)
#   - scripts/update_ai_tools.sh / .ps1                  (chezmoi execute-template at runtime)
#   - tests/update_guardrail_versions.sh                 (single-pin contract)
#
# Never resolve "latest": every value here is a reviewed exact release tag
# (assets + SHA256SUMS verified before pinning). Bumping = edit this one line.
# VS Code extensions installed globally by the installers (idempotent,
# `code --install-extension`), gated by data.packages.vscode_settings.
# Operator-curated 2026-09-21 from the surveyed project recommendations +
# installed sets; gitlens and todo-tree are explicitly VETOED by the
# operator - do not re-add (contract-enforced).
vscode:
  # The VS Code SETTINGS are not here: they live in each machine's chezmoi.toml
  # [data.vscode.settings], seeded from .chezmoitemplates/vscode-settings.toml by
  # `chezmoi init` (docs/vscode.md). chezmoi deep-merges this file with the config's
  # data, so a settings table here would come back under any key deleted there.
  extensions:
    # Tier 1 - editor core
    - EditorConfig.EditorConfig
    - streetsidesoftware.code-spell-checker
    - mhutchie.git-graph
    - donjayamanne.githistory
    - christian-kohler.path-intellisense
    - aaron-bond.better-comments
    - vscode-icons-team.vscode-icons
    # Tier 2 - remote/SSH + containers
    - ms-vscode-remote.remote-ssh
    - ms-vscode-remote.remote-ssh-edit
    - ms-vscode.remote-explorer
    - ms-vscode-remote.remote-containers
    - ms-azuretools.vscode-containers
    - ms-azuretools.vscode-docker
    # Tier 3 - python core
    - ms-python.python
    - ms-python.vscode-pylance
    - ms-python.debugpy
    - charliermarsh.ruff
    # Tier 4 - docs/data viewing
    - bierner.markdown-mermaid
    - yzhang.markdown-all-in-one
    - tomoki1207.pdf
    - rahulraghunathb.excel-lite
    - mikestead.dotenv
    - redhat.vscode-yaml
    - tamasfe.even-better-toml
  # Windows-only additions (the list above is cross-platform)
  extensions_windows:
    - ms-vscode-remote.remote-wsl

# Version pins shared across the installers and bootstraps (#125). Every value
# is hand-reviewed (a deliberate pin, never "latest"): bumping = edit this one
# table, then run scripts/update-versions.sh, which syncs the derived copies
# (the catalog's brew node@NN and the bootstraps' fallback literals) - those
# exist only where the yaml cannot be read (fresh one-liner installs).
#   node_major       - apt repo line, version gates, brew formula; node_choco is
#                      the full Chocolatey package version on Windows
#   antigravity_hub  - the 2.0 hub channel pin for the macOS dmg/Linux tar.gz
#                      (scripts/update-versions.sh re-checks it weekly)
#   gum              - the bootstrap pin for the package menu
#   claude_install_* - the official native-installer URLs, so `dot upgrade`
#                      cannot install a different Claude than the installer did
#   maestro_version/ - the mobile_dev group's Maestro CLI pin. The vendor's own
#   maestro_sha256     `curl -fsSL https://get.maestro.mobile.dev | bash`
#                      installer only runs `unzip -qt` on what it downloads -
#                      a corruption check, not an authenticity one - so this
#                      repo pins an exact version and verifies the sha256
#                      itself, the same way install_powershell() does. The
#                      digest is not computed by us: it is read from
#                      mobile-dev-inc's own homebrew-tap formula, generated
#                      by JReleaser at release time from the identical
#                      release asset (scripts/update-versions.sh re-checks it
#                      weekly).
#   jdk_version      - the standalone JDK major mobile_dev's Maestro/Gradle/SDK
#                      command-line tools need (design doc section 3.5),
#                      shared by both installer twins. 17 per Maestro's own
#                      "Java 17 or higher" requirement - a deliberate pin
#                      like node_major, NOT re-resolved by
#                      scripts/update-versions.sh (package managers key JDK
#                      packages by major version only; bump it by hand if
#                      the floor ever needs to move).
#   android_commandlinetools_* - the mobile_dev group's Android SDK
#                      command-line tools zip (sdkmanager/avdmanager), per
#                      platform/arch (win, linux, mac_x86_64, mac_arm64 -
#                      design doc section 3.4; Studio is dropped entirely),
#                      one version shared by every OS, one SHA-256 per zip.
#                      Confirmed live against
#                      developer.android.com/studio#command-line-tools-only
#                      on 2026-10-10, where Google publishes each digest next
#                      to its zip - so this pins the digest, never a bare
#                      "latest" URL. A deliberate hand pin like jdk_version,
#                      NOT re-resolved by scripts/update-versions.sh: bump the
#                      version and all four digests together from that page.
versions:
  node_major: 24
  node_choco: "24.19.0"
  jdk_version: 17
  android_commandlinetools_version: "15859902"
  android_commandlinetools_sha256_win: "90ae805d20434428bffcb699c290860f19bb5f66a67e6b330067e3de801fb04a"
  android_commandlinetools_sha256_linux: "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
  android_commandlinetools_sha256_mac_x86_64: "c5a6378ab5cf7e0d5701921405115befff13e9ff7417fb588389338f8bd050f3"
  android_commandlinetools_sha256_mac_arm64: "835b62a26162b229b441d1f6d4680383815a270809eb33522c0d480fa5002c4e"
  antigravity_hub: "2.24.0-5780333019398144"
  gum: "2.0.1"
  powershell: "7.6.7"
  # Pinned rather than read from the release's own hashes.sha256: that file is
  # UTF-16LE with a BOM, CRLF line endings and a binary-mode `*` before the
  # name - three parsing hazards in a verification step that must not be
  # clever. Pinning the digest is what .chezmoiexternal.toml already does for
  # every archive. scripts/update-versions.sh refreshes all three together.
  powershell_sha256_x64: "6896f9e3a6b0a354bf470835a96da76d2f801cd50dcf047ad7c4563bf93bf431"
  powershell_sha256_arm64: "ba465efdfb0984c1c5dc5ed9eb0b79a7e91a1b52c45f99377058c0659b84d3f1"
  claude_install_sh: "https://claude.ai/install.sh"
  claude_install_ps1: "https://claude.ai/install.ps1"
  maestro_version: "2.11.0"
  maestro_sha256: "5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a"
  # lychee and vale: Linux release tarballs for the modern_cli docs tooling (no apt
  # package). Rendered into run_onchange_install_packages.sh.tmpl, followed by
  # `dot upgrade` (release_tool_pin_sync), moved by scripts/update-versions.sh
  # (the newest tag plus both architecture digests, recomputed from the assets).
  lychee_version: "0.24.2"
  lychee_sha256_x86_64: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"
  lychee_sha256_aarch64: "91a7bd65685da41b90ccb9bc867a3d649a7818042dae04ff405e55a25bddee4c"
  vale_version: "3.24.0"
  vale_sha256_x86_64: "867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214"
  vale_sha256_aarch64: "104cbd349279e50c4cb40adb70adf345d93cc4a3a0191f9e68bdccb97086b582"
  # The Linux full-install check must not depend on GitHub's unauthenticated
  # releases API. Pin the exact asset and verify it before installation.
  lazygit_version: "0.66.2"
  lazygit_sha256_x86_64: "158efc9ddfa1241fab5fb3526bb442c8dc6c4b1904d73213b9e4e93e03c52034"
  lazygit_sha256_aarch64: "79a3161eeb642f0473e23db6341f7baabd4a5933e921a9c1167c5d5c765c41a4"

