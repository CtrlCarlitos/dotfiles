# The package catalog: every tool the installers install through a package
# manager, once, with its name on each manager. Both installer twins and
# scripts/migrate-to-winget.ps1 render or read this list; none of them carries
# a name of its own. See docs/package-groups.md and issue #83.
#
# One record per TOOL, not per package name, because the same tool is spelled
# differently everywhere: fd is fd-find on apt, 7-Zip is p7zip-full / sevenzip /
# 7zip.install, the Meslo font is a manual download / a cask / nerd-fonts-meslo.
#
# Fields
#   id       the tool, for humans and for the contract test
#   group    the package group that installs it (a promptBoolOnce key)
#   apt      Debian/Ubuntu package - ONLY where a plain `apt install` suffices.
#            Tools that need a repo, a key or a .deb download are installed by a
#            procedure in run_onchange_install_packages.sh.tmpl and have no apt
#            key here (their `note` says so).
#   brew     Homebrew formula
#   cask     Homebrew cask (macOS desktop apps and fonts)
#   winget   winget package id (Windows). winget is the primary Windows manager;
#            Chocolatey is the fallback for what winget lacks or carries older.
#   choco    Chocolatey package (Windows), only where winget has no (current) package
#   winget_args  extra `winget install` arguments (e.g. "--scope machine": keep an app
#            machine-wide, where Chocolatey put it, instead of winget's per-user default)
#   choco_was  the Chocolatey name this tool had before it moved to winget:
#            scripts/migrate-to-winget.ps1 uses it to find and replace that copy
#   npm      global npm package, the same name on every OS (needs Node). `dot up`
#            installs it when missing; `dot upgrade` updates it when installed.
#   note     why this tool, or a caveat worth keeping next to its name
#   migrate_risk  shown by migrate-to-winget before it
#            asks; the tool IS a candidate but uninstalling it has a consequence
#
# Order matters within a group: it is the install order on every manager.

catalog:
  packages:
    # ------------------------------------------------------------ core
    - id: git
      group: core
      apt: git
      brew: git
      winget: Git.Git
      choco_was: git.install
      migrate_risk: "chezmoi's own source directory is a git repo and open shells may be using git; finish other work first"
    - id: curl
      group: core
      apt: curl
      brew: curl
      winget: cURL.cURL
      choco_was: curl
    - id: wget
      group: core
      apt: wget
      brew: wget
      winget: JernejSimoncic.Wget
      choco_was: wget
    - id: jq
      group: core
      apt: jq
      brew: jq
      winget: jqlang.jq
      choco_was: jq
    - id: fzf
      group: core
      apt: fzf
      brew: fzf
      winget: junegunn.fzf
      choco_was: fzf
    - id: zsh
      group: core
      apt: zsh
      brew: zsh
    - id: tmux
      group: core
      apt: tmux
      brew: tmux
    - id: neovim
      group: core
      brew: neovim
      winget: Neovim.Neovim
      choco_was: neovim
      note: "apt: installed by a procedure with a fallback (the release's neovim may be too old)"
    - id: ripgrep
      group: core
      apt: ripgrep
      brew: ripgrep
      winget: BurntSushi.ripgrep.MSVC
      choco_was: ripgrep
    - id: htop
      group: core
      apt: htop
      brew: htop
    - id: gh
      group: core
      brew: gh
      winget: GitHub.cli
      choco_was: gh
      note: "apt: installed from GitHub's own repo by a procedure"
    - id: tree
      group: core
      apt: tree
      brew: tree
      winget: GnuWin32.Tree
      choco_was: tree
    - id: 7zip
      group: core
      apt: p7zip-full
      brew: sevenzip
      winget: 7zip.7zip
      choco_was: 7zip.install
    - id: cmake
      group: core
      apt: cmake
      brew: cmake
      winget: Kitware.CMake
      choco_was: cmake
    - id: ffmpeg
      group: core
      apt: ffmpeg
      brew: ffmpeg
      winget: Gyan.FFmpeg
      choco_was: ffmpeg
    - id: python
      group: core
      apt: python3
      brew: python3
      choco: python
    - id: python-venv
      group: core
      apt: python3-venv
    - id: node
      group: core
      brew: node@24
      winget: OpenJS.NodeJS.LTS
      choco_was: nodejs
      migrate_risk: "Node 26 (Chocolatey floated past the 24 LTS pin) -> 24 LTS"
      note: "apt: NodeSource setup script by procedure; winget: Install-Node installs OpenJS.NodeJS.LTS by procedure (the LTS line, versions.node_major); choco only where winget is missing"
    - id: coreutils
      group: core
      brew: coreutils
      note: "GNU coreutils on macOS (gtimeout for net_timeout)"
    - id: build-tools
      group: core
      apt: build-essential
      brew: gcc
      note: "Windows: not installed - nothing the dotfiles install there builds native code"
    - id: bc
      group: core
      apt: bc
    - id: openssh-client
      group: core
      apt: openssh-client
    - id: ca-certificates
      group: core
      apt: ca-certificates
    - id: zstd
      group: core
      apt: zstd
    - id: socat
      group: core
      apt: socat
      note: "ssh-agent-relay bridges the Windows agent into WSL through socat"
    - id: ssh-agent-filter
      group: core
      apt: ssh-agent-filter
      note: "ssh-agent-relay's per-account key filtering"
    - id: go
      group: core
      apt: golang-go
      brew: go
      winget: GoLang.Go
      choco_was: golang
      note: "the Go toolchain (agent-guardrails builds with it); apt: the archive's golang-go, older than upstream"
    - id: terraform
      group: core
      brew: hashicorp/tap/terraform
      winget: Hashicorp.Terraform
      choco_was: terraform
      note: "apt: HashiCorp's apt repo by procedure; brew: HashiCorp's tap (Homebrew core froze terraform at 1.5.7 after the license change)"
    - id: mkcert
      group: core
      apt: mkcert
      brew: mkcert
      winget: FiloSottile.mkcert
      choco_was: mkcert
      note: "locally trusted TLS certificates for local development; kept until caddy's own local CA replaces it"
    - id: gsudo
      group: core
      winget: gerardog.gsudo
      choco_was: gsudo
    - id: powershell-core
      group: core
      winget: Microsoft.PowerShell
      winget_args: "--scope machine"
      choco_was: powershell-core
      migrate_risk: "PowerShell 7 cannot replace itself - run migrate-to-winget from Windows PowerShell (powershell.exe) to move it"
      note: >-
        Unix has no manager key on purpose - pwsh is installed by procedure
        there (install_powershell): Linux takes the pinned GitHub release
        tarball, because Microsoft's apt repo is published per Ubuntu release
        and lags new ones; macOS takes the `powershell` cask. It is wanted on
        Unix for one reason - half this repo's suite is PowerShell, and
        `tests/run.sh --strict` counts a skip as a failure, so without pwsh a
        Linux/macOS checkout can never run a green suite. See docs/testing.md.
    - id: psmux
      group: core
      winget: marlocarlo.psmux
      choco_was: psmux
      note: >-
        The native Windows tmux (Rust, github.com/psmux/psmux) - official
        Chocolatey package, ships psmux/pmux/tmux commands. Listed right
        after powershell-core deliberately: psmux recommends PS 7+, and the
        install order follows this list. The dotfiles manage its config at
        dot_config/psmux/psmux.conf (the Windows twin of dot_tmux.conf) and
        a matching "psmux" Windows Terminal profile; ~/.tmux.conf and ~/.tmux/
        stay Windows-ignored.
    - id: wsl2
      group: core
      note: >-
        Windows: no package manager. The installer runs `wsl --install
        --no-distribution` when WSL is missing; `dot upgrade` runs `wsl
        --update`, WSL's own updater (winget's Microsoft.WSL lags it). The old
        Chocolatey record is dropped with --skip-autouninstaller, which keeps
        WSL itself (scripts/migrate-to-winget.ps1).
    - id: npiperelay
      group: core
      choco: npiperelay
      note: >-
        Bridges the Windows ssh-agent named pipe into WSL, so a WSL distro (and
        any devcontainer launched from it) uses the Windows agent and holds no
        private keys of its own. See docs/ssh-agents.md.

    # ------------------------------------------------------ modern_cli
    - id: bat
      group: modern_cli
      apt: bat
      brew: bat
      winget: sharkdp.bat
      choco_was: bat
      note: "apt: binary installs as batcat, aliased to bat; shares its apt install line with fd - a multi-package apt install fails wholesale if one name is unavailable on a release"
    - id: less
      group: modern_cli
      apt: less
      brew: less
      winget: jftuga.less
      choco_was: less
      note: "bat's pager on Windows: Chocolatey's bat pulled it in as a dependency, winget's bat does not"
    - id: eza
      group: modern_cli
      brew: eza
      winget: eza-community.eza
      choco_was: eza
      note: "apt: from the gierens repo with its signing key, by procedure"
    - id: fd
      group: modern_cli
      apt: fd-find
      brew: fd
      winget: sharkdp.fd
      choco_was: fd
      note: "apt: package is fd-find, binary installs as fdfind (aliased to fd) - same naming conflict as batcat"
    - id: delta
      group: modern_cli
      brew: git-delta
      winget: dandavison.delta
      choco_was: delta
      note: "apt: GitHub release .deb by procedure"
    - id: starship
      group: modern_cli
      brew: starship
      winget: Starship.Starship
      choco_was: starship
      note: "apt: upstream install script by procedure"
    - id: zoxide
      group: modern_cli
      brew: zoxide
      winget: ajeetdsouza.zoxide
      choco_was: zoxide
      note: "apt: package where the release has it, upstream script as fallback - by procedure"
    - id: direnv
      group: modern_cli
      apt: direnv
      brew: direnv
      winget: direnv.direnv
      choco_was: direnv
      note: "hooked from .zshrc (direnv hook zsh); .envrc files are allowed per project, never by the installer"
    - id: lazygit
      group: modern_cli
      brew: lazygit
      winget: JesseDuffield.lazygit
      choco_was: lazygit
      note: "apt: GitHub release tarball by procedure"
    - id: gum
      group: modern_cli
      brew: gum
      winget: charmbracelet.gum
      note: "apt: Charm's repo by procedure"
    - id: tealdeer
      group: modern_cli
      brew: tealdeer
      winget: dbrgn.tealdeer
      choco_was: tealdeer
      note: "apt: official static binary by procedure (not in the archive before Ubuntu 23.04/lunar)"
    - id: dust
      group: modern_cli
      brew: dust
      winget: bootandy.dust
      choco_was: dust
      note: "apt: GitHub release .deb by procedure"
    - id: duf
      group: modern_cli
      apt: duf
      brew: duf
      winget: muesli.duf
      choco_was: duf
      note: "aliased over df when present"
    - id: procs
      group: modern_cli
      brew: procs
      winget: dalance.procs
      choco_was: procs
      note: "apt: GitHub release by procedure"
    - id: shellcheck
      group: modern_cli
      apt: shellcheck
      brew: shellcheck
      winget: koalaman.shellcheck
      choco_was: shellcheck
      note: "CI and .pre-commit-config.yaml lint shell with it - a fresh machine needs it locally, not only in CI"
    - id: shfmt
      group: modern_cli
      brew: shfmt
      winget: mvdan.shfmt
      choco_was: shfmt
      note: "apt: official release binary by procedure, checksum-verified on x86_64/amd64 and aarch64/arm64"
    - id: markdownlint-cli2
      group: modern_cli
      npm: markdownlint-cli2
      note: "npm global on every OS (`npm install -g markdownlint-cli2` after Node), so no manager column names it. Markdown structure lint for any repo; the release-notes and update-docs skills check their output with it (CtrlCarlitos/skills#2, #3)"
    - id: lychee
      group: modern_cli
      brew: lychee
      winget: lycheeverse.lychee
      choco_was: lychee
      note: "broken-link checker for docs (CtrlCarlitos/skills#3); apt: not in the archive - pinned GitHub release tarball by procedure, checksum-verified"
    - id: vale
      group: modern_cli
      brew: vale
      choco: vale
      note: "prose and style linter for docs (CtrlCarlitos/skills#3); apt: not in the archive - pinned GitHub release tarball by procedure, checksum-verified"
    - id: pstop
      group: modern_cli
      winget: marlocarlo.pstop
      choco_was: pstop

    # Network diagnostics: the familiar ifconfig/dig/traceroute set (#177).
    # macOS already ships ifconfig, netstat, dig, traceroute, tcpdump and
    # whois natively, so only the gaps carry brew names here; Windows keeps
    # its own netsh/ipconfig stack. Order: legacy net-tools first (its
    # ifconfig/netstat/route/arp are the ones muscle memory reaches for),
    # then DNS, paths, and the traffic tools.
    - id: net-tools
      group: modern_cli
      apt: net-tools
      note: "ifconfig/netstat/route/arp; Linux only - macOS and Windows ship their own"
    - id: dnsutils
      group: modern_cli
      apt: dnsutils
      note: "dig/nslookup/host; macOS ships dig and nslookup"
    - id: traceroute
      group: modern_cli
      apt: traceroute
      note: "macOS ships traceroute natively; tracepath rides iproute2 on Linux"
    - id: mtr
      group: modern_cli
      apt: mtr-tiny
      brew: mtr
      note: "apt: mtr-tiny is the curses traceroute+ping without the GUI dep"
    - id: tcpdump
      group: modern_cli
      apt: tcpdump
      note: "macOS ships tcpdump natively (sudo required)"
    - id: nmap
      group: modern_cli
      apt: nmap
      brew: nmap
    - id: whois
      group: modern_cli
      apt: whois
      note: "macOS ships whois natively"
    - id: iperf3
      group: modern_cli
      apt: iperf3
      brew: iperf3
      note: "apt: its postinst may ask whether to start the daemon - the default (no) is what we want; nothing here starts it"
    - id: telnet
      group: modern_cli
      apt: telnet
      brew: telnet
      note: "macOS removed telnet in 10.13+ - the brew formula fills that gap"

    # ----------------------------------------------------------- fonts
    - id: meslo-nerd-font
      group: fonts
      cask: font-meslo-lg-nerd-font
      choco: nerd-fonts-meslo
      note: "apt: downloaded from the Nerd Fonts release by procedure"
    - id: firacode-nerd-font
      group: fonts
      cask: font-fira-code-nerd-font
      choco: nerd-fonts-FiraCode
      note: "apt/WSL: downloaded from the Nerd Fonts release by procedure, same as meslo-nerd-font"

    # ----------------------------------------------------- dev_desktop
    # Windows-only utilities first, then the cross-platform apps.
    - id: powertoys
      group: dev_desktop
      winget: Microsoft.PowerToys
      choco_was: powertoys
    - id: files
      group: dev_desktop
      winget: FilesCommunity.Files
      choco_was: files
    - id: cpu-z
      group: dev_desktop
      winget: CPUID.CPU-Z
      choco_was: cpu-z.install
    - id: crystaldiskinfo
      group: dev_desktop
      winget: CrystalDewWorld.CrystalDiskInfo
      choco_was: crystaldiskinfo.install
    - id: crystaldiskmark
      group: dev_desktop
      winget: CrystalDewWorld.CrystalDiskMark
      choco_was: crystaldiskmark
    - id: everything
      group: dev_desktop
      winget: voidtools.Everything
      choco_was: Everything
    - id: ghostscript
      group: dev_desktop
      apt: ghostscript
      cask: ghostscript
      note: "Windows: none - it came with CutePDF, which Microsoft Print to PDF replaced"
    - id: docker-desktop
      group: dev_desktop
      cask: docker
      note: >-
        apt: official .deb download by procedure. Windows: winget
        (Docker.DockerDesktop, Docker's own EXE installer) by procedure, not
        Chocolatey: the Chocolatey package installs Docker's MSI, lags Docker's
        releases, and `winget upgrade` refuses a Chocolatey copy (different
        install technology). Moving an existing Chocolatey copy is manual and
        keeps the data disk: docs/windows.md, Docker Desktop through winget.
    - id: vscode
      group: dev_desktop
      cask: visual-studio-code
      winget: Microsoft.VisualStudioCode
      winget_args: "--scope machine"
      choco_was: vscode.install
      migrate_risk: "VS Code is probably open; close it, or the reinstall will fail or restart it"
      note: "apt: Microsoft's repo by procedure"
    - id: geany
      group: dev_desktop
      apt: geany
      cask: geany
      winget: Geany.Geany
      choco_was: geany
      note: >-
        Replaces Notepad++ (Windows-only): free, open source, and the same
        "lightweight quick-edit GUI editor" role on all three platforms.
    - id: obs-studio
      group: dev_desktop
      apt: obs-studio
      cask: obs
      winget: OBSProject.OBSStudio
      choco_was: obs-studio.install
    - id: qbittorrent
      group: dev_desktop
      apt: qbittorrent
      cask: qbittorrent
      winget: qBittorrent.qBittorrent
      choco_was: qbittorrent
    - id: sharex
      group: dev_desktop
      winget: ShareX.ShareX
      choco_was: sharex
    - id: meld
      group: dev_desktop
      apt: meld
      cask: meld
      note: >-
        Replaces WinMerge (Windows-only): Meld is already the Linux/macOS
        diff/merge tool here, so one tool everywhere. Windows installs it via
        winget (Meld.Meld) by procedure, not Chocolatey: the Chocolatey package
        lags (3.22.2 vs 3.24.0) and `winget upgrade --all` refuses to upgrade
        a Chocolatey-installed copy (different installer technology).
    - id: wiztree
      group: dev_desktop
      winget: AntibodySoftware.WizTree
      choco_was: wiztree
    - id: termius
      group: dev_desktop
      cask: termius
      winget: Termius.Termius
      choco_was: termius
      migrate_risk: "signed-in state lives in the profile; the app itself is replaced"
      note: >-
        Replaces FileZilla: one SSH/SFTP client on all three platforms.
        FileZilla's Homebrew cask was pulled outright (adware concerns).
        apt: vendor .deb download by procedure.
    - id: telegram
      group: dev_desktop
      apt: telegram-desktop
      cask: telegram
      winget: Telegram.TelegramDesktop
      choco_was: telegram.install
    - id: vlc
      group: dev_desktop
      apt: vlc
      cask: vlc
      winget: VideoLAN.VLC
      choco_was: vlc
    - id: handy
      group: dev_desktop
      cask: handy
      winget: cjpais.Handy
      choco_was: handy
      migrate_risk: "activation and settings may live in the install directory and can be lost"
      note: >-
        Speech-to-text (handy.computer). Whisper/Parakeet model choice is GUI-only,
        nothing to pre-seed: for Spanish + English pick a Whisper model after
        install (Parakeet is English-only) - Large for accuracy, Turbo for speed.
        apt: GitHub release .deb by procedure.
    - id: google-chrome
      group: dev_desktop
      cask: google-chrome
      note: >-
        apt: Google's .deb download by procedure. Windows: winget
        (Google.Chrome - installs the same enterprise MSI Google publishes),
        not Chocolatey, by procedure (a lingering Chocolatey copy is removed
        first - see the install script's Google Chrome block).
    - id: ghostty
      group: dev_desktop
      cask: ghostty
      note: "apt: universe on Ubuntu 26.04+, warns elsewhere - by procedure. Windows: Windows Terminal instead"
    - id: flameshot
      group: dev_desktop
      apt: flameshot
      cask: flameshot
    - id: rectangle
      group: dev_desktop
      cask: rectangle
    - id: raycast
      group: dev_desktop
      cask: raycast
    - id: codexbar
      group: dev_desktop
      cask: codexbar
      note: "Windows: Win-CodexBar via winget by procedure"
    - id: screenrec
      group: dev_desktop
      note: >-
        Screen capture recorder; no package-manager name on any platform by
        design. apt: vendor repo + signing key, then apt install, by procedure
        - the .deb hard-depends on the removed libgdk-pixbuf2.0-0 on Ubuntu
        24.04+, so the source is rolled back on failure. cask: none - the
        vendor .dmg by procedure. choco: none - the vendor .exe by procedure.
        winget: checked 2026-10 - no package for this app, only unrelated
        screen-recording tools under similar names.

    # --------------------------------------------------- remote_access
    - id: tailscale
      group: remote_access
      cask: tailscale-app
      winget: Tailscale.Tailscale
      choco_was: tailscale
      migrate_risk: "LIVE VPN - uninstalling drops your tailnet connection until the reinstall completes"
      note: "apt: Tailscale's repo by procedure."
    - id: cloudflared
      group: remote_access
      brew: cloudflared
      winget: Cloudflare.cloudflared
      choco_was: cloudflared
      note: "apt: Cloudflare's repo by procedure"

    # ---------------------------------------------------- agent groups
    - id: act
      group: agent_toolkit
      winget: nektos.act
      choco_was: act-cli
      note: "brew/apt: installed by procedure in the agent_toolkit block"
    - id: antigravity-cli
      group: antigravity_cli
      choco: antigravity-cli
    - id: claude-desktop
      group: claude_desktop
      winget: Anthropic.Claude
      choco_was: claude
      migrate_risk: "app data stays in the profile; only the app itself is replaced"
    - id: antigravity-desktop
      group: antigravity_desktop
      winget: Google.Antigravity
      choco_was: antigravity
    - id: opencode-desktop
      group: opencode_desktop
      winget: SST.OpenCodeDesktop
      choco_was: opencode-desktop
    - id: opencode-cli
      group: opencode_cli
      winget: SST.opencode
      choco_was: opencode
      note: "Windows only here: the Unix installers use OpenCode's own install script. Chocolatey's opencode package pulled fzf, ripgrep and unzip in as dependencies, which kept those on Chocolatey too"
      migrate_risk: "close every opencode session first - its binary is replaced (fzf and ripgrep can move after it)"
