# The agent catalog: values the agent-toolkit logic consumes, written once.
# Both installer twins render from here; scripts/update_ai_tools.{sh,ps1} read
# it at runtime through `chezmoi execute-template`, exactly as they read the
# guardrail pin. See issue #83 (phase C).
#
# The logic itself stays in the installers - it is procedure in two languages
# and cannot be shared. What CAN drift is the data inside it, and it had:
# the MCP server table was written six times (four in the .sh alone - the
# agent_toolkit block exists once under install_apt and once under
# install_brew, byte for byte), an npm allow-scripts list three times, the
# Codex package name and the skills-CLI agent list four times each.
#
# Guardrail is deliberately absent: its install logic and pin are owned by the
# agent-guardrails repo (docs/invariants.md #11).

agents:
  # MCP servers registered for OpenCode (global opencode.json, `mcp` block)
  # and for agy (top-level ~/.gemini/config/mcp_config.json, each server with
  # forceAllToolsEager - #175: agy marks every server's tools lazy by default,
  # and lazy tools are only reachable through the generic call_mcp_tool
  # invoker, which guardrail denies by design; forceAllToolsEager promotes
  # them to native mcp_<server>_<tool> entries guardrail's registry already
  # classifies. A plugin bundle is not an alternative: it prefixes the server
  # name, and guardrail does not know mcp_dotfiles-mcp_serena_*). Each entry
  # is either LOCAL (bare command + args - a binary the installer runs, e.g.
  # serena) or REMOTE (type: remote + url - a hosted, OAuth-authenticated MCP
  # server OpenCode/agy dial out to directly, e.g. Expo's mcp.expo.dev/mcp,
  # design doc #3.8). Maestro's MCP server (`maestro mcp`, installed by
  # mobile_dev) is a LOCAL entry here, so OpenCode/agy get it from this
  # catalog like serena; Claude Code/Codex get it from their own install
  # functions (`claude mcp add -s user` / `codex mcp add`), not from here.
  # Each consumer builds its own shape:
  #   OpenCode local   {type: local, command: [command, ...args], enabled: true}
  #   OpenCode remote  {type: remote, url: <url>, enabled: true}
  #   agy local        {command, args, forceAllToolsEager: true}
  #   agy remote       {httpUrl: <url>, oauth: {}, forceAllToolsEager: true}
  # `group: <packages key>` (optional) names the package group that owns the
  # entry: when that group's install-time flag (.packages.<group>) is off,
  # the entry is never registered, local or remote, even if a same-named
  # binary happens to be on PATH from an unrelated install (a disabled group
  # has no side effects). Absent `group` (serena's case) means the entry
  # belongs to no optional group and is registered whenever it otherwise
  # qualifies. Then, per kind: a LOCAL entry is registered only when its
  # binary is present (`command -v <command>`); a REMOTE entry has no binary
  # to probe, so its `group` flag is its whole gate. See
  # sync_agent_mcp_catalog() (run_onchange_install_packages.sh.tmpl). The
  # Windows twin's $mcpCatalog (.chezmoitemplates/mcp-servers-ps1) reads only
  # command/args and ignores `group`.
  mcp:
    # Serena 2.0.0 (2026-10-13) renamed the generic `ide-assistant` context to `claude-code` (a
    # deprecation warning on every start otherwise) and ships one per harness; `args_agy` is the
    # Antigravity override, read by both installers' agy branch, `args` serves everyone else.
    serena:
      command: serena
      args: [start-mcp-server, --context, claude-code]
      args_agy: [start-mcp-server, --context, antigravity]
    maestro:
      command: maestro
      args: [mcp]
      group: mobile_dev
    agent-device:
      command: agent-device
      args: [mcp]
      group: mobile_dev
    expo:
      type: remote
      url: https://mcp.expo.dev/mcp
      group: mobile_dev

  # Serena's web dashboard opens a browser tab every time a client starts the
  # MCP server (one per agent per session). false keeps the dashboard running
  # but stops the tab; the installers re-assert Serena's
  # `web_dashboard_open_on_launch` line from this value after every `serena
  # init`. Per-machine override, in ~/.config/chezmoi/chezmoi.toml:
  #   [data.agents.serena]
  #   open_dashboard = true
  # dashboard_interface: browser | app | tray_manager. Left empty, Serena picks
  # the platform default, which on Windows/macOS is `app`: a native window
  # with ONE TRAY ICON PER INSTANCE. Every agent session and every `claude -p`
  # run spawns an instance, and exited ones leave ghost icons (48 counted on
  # 2026-09-24). `browser` creates no icon; the dashboard stays reachable at
  # http://localhost:24282/dashboard/. Override the same way as open_dashboard.
  serena:
    open_dashboard: false
    dashboard_interface: browser
  npm:
    # Codex CLI. The installers install it; the updaters upgrade it to @latest.
    codex: "@openai/codex"
    # Claude Code's npm package, used ONLY to read its latest version: Claude Code is
    # installed by its native installer, whose releases carry the same version numbers.
    # dot upgrade re-runs that installer (~20 s) only when `claude --version` differs.
    claude_code_version: "@anthropic-ai/claude-code"

  skills:
    # `skills add ... -a <agents>`: which agent CLIs the curated skills are
    # installed for. Antigravity is deliberately NOT here - it has no skills
    # CLI adapter; the installers copy the Claude skills into its directory.
    agents: [claude-code, opencode, codex]
