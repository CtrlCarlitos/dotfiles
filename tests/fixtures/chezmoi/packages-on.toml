# Every installable group on: the full-install-* jobs run the real installers.
# Two stay off, each for a reason that is not "we forgot":
#   remote_access_server - requires manual SSH server setup by design.
#   guardrail            - `plane enable --all` needs an interactive WebAuthn
#                          approval CI cannot complete (exit 2 on non-terminal
#                          stdin fails the run by contract). Exercised on real
#                          machines instead.
[data.packages]
  core = true
  modern_cli = true
  fonts = true
  agent_toolkit = true
  opencode_cli = true
  opencode_desktop = true
  claude_cli = true
  claude_desktop = true
  chatgpt_cli = true
  chatgpt_desktop = true
  antigravity_cli = true
  antigravity_desktop = true
  dev_desktop = true
  remote_access = true
  remote_access_server = false
  guardrail = false
