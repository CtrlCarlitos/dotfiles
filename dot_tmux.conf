#===============================================================================
# TMUX CONFIGURATION
# A beginner-friendly tmux setup with sensible defaults
#===============================================================================

#-------------------------------------------------------------------------------
# General Settings
#-------------------------------------------------------------------------------
# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer
set -g history-limit 50000

# Don't wait for escape sequences
set -s escape-time 0

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Ghostty identifies as xterm-ghostty: same 24-bit color.
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Focus events for vim
set -g focus-events on

#-------------------------------------------------------------------------------
# Key Bindings
#-------------------------------------------------------------------------------
# Change prefix from Ctrl-b to Ctrl-a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift + vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch windows with Shift + arrow
bind -n S-Left previous-window
bind -n S-Right next-window

# Move windows with Ctrl + Shift + arrow
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

#-------------------------------------------------------------------------------
# Copy Mode (vim-like)
#-------------------------------------------------------------------------------
setw -g mode-keys vi

# Enter copy mode with prefix + [
# Start selection with v, yank with y
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# OSC 52: every tmux copy (y, mouse drag) is also sent to the OUTER terminal,
# which puts it on the local clipboard - over SSH too, where no clipboard
# tool exists. Windows Terminal accepts OSC 52 writes; so do iTerm2, Ghostty,
# WezTerm, kitty. Apps inside tmux (nvim over SSH) can use it as well.
set -s set-clipboard on

# Copy to system clipboard (Linux desktop): only with a real X display -
# on a headless SSH host xclip exists but fails, so OSC 52 above does it.
if-shell '[ -n "$DISPLAY" ] && command -v xclip' {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
}

# Copy to system clipboard (Linux desktop on Wayland)
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy' {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
}

# Copy to system clipboard (macOS) - Terminal.app ignores OSC 52, and iTerm2
# only honors it with "Applications in terminal may access clipboard" on.
if-shell "command -v pbcopy" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
}

# Copy to system clipboard (WSL with Windows clipboard) - last, so it wins
# over xclip/wl-copy under WSLg.
if-shell "command -v clip.exe" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
}

#-------------------------------------------------------------------------------
# Status Bar
#-------------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

# Colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left side: session name
set -g status-left-length 30
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[bg=#1e1e2e] "

# Right side: date and time
set -g status-right-length 50
set -g status-right "#[fg=#a6adc8] %Y-%m-%d #[fg=#cdd6f4,bold]%H:%M "

# Window tabs
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W "

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

#-------------------------------------------------------------------------------
# Plugins - TPM and the three plugins below are pinned externals in
# .chezmoiexternal.toml; `chezmoi apply` installs them into ~/.tmux/plugins.
#-------------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save sessions

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

#-------------------------------------------------------------------------------
# Cheatsheet (prefix = Ctrl+a)
#-------------------------------------------------------------------------------
# prefix + |     Split vertically
# prefix + -     Split horizontally
# prefix + hjkl  Navigate panes
# prefix + c     New window
# prefix + n/p   Next/previous window
# prefix + d     Detach
# prefix + [     Enter copy mode (vim keys, v to select, y to copy)
# prefix + r     Reload config
# prefix + I     Install plugins (after adding to config)
