{{- /* chezmoi:modify-template */ -}}
{{- /*
  Codex CLI settings (~/.codex/config.toml, every OS).

  MERGE, not own - and more carefully than the other two modify-templates in
  this repo. Codex rewrites this file constantly and with machine-specific
  content: per-project `trust_level` entries keyed by absolute path, SHA-256
  `trusted_hash` values for every hook in hooks.json, `[notice.*]` model
  migrations, `[tui.model_availability_nux]` counters. Owning it would wipe
  that on every apply and re-prompt for trust in every repo.

  Why this one is text-surgical instead of parse-and-reserialise (which is what
  modify_settings.json and modify_tui.json do with JSON): a TOML round-trip
  would drop Codex's comments and re-quote its literal table headers - keys like
  [projects.'C:\Users\carlitos\...'] carry backslashes and single quotes whose
  re-quoting we'd have to get exactly right, with a broken config.toml as the
  failure mode. Instead every byte Codex wrote is passed through untouched and
  exactly one key is forced.

  The forced keys:
    tui.keymap.editor.insert_newline   (below)
    tui.copy_on_select = "always"      (see the end of this comment)

  Codex's keymap is tui.keymap.{global,chat,composer,editor,pager,list,agents,approval,vim_*},
  and its default newline bindings are shift-enter and ctrl-j only. OpenCode and agy
  accept Ctrl+Enter natively and Claude Code is rebound by dot_claude/modify_keybindings.json;
  Codex silently did nothing, so it is bound here to keep all four the same
  (docs/terminal.md, "New line vs submit").
  Alt+Enter is included for the same reason - Windows Terminal leaves it unbound
  here (full screen is F11), so it reaches the CLI.

  Key names are lowercase and hyphenated: ctrl-a, shift-enter, page-down. An
  invalid one is not ignored - Codex refuses to start with "data did not match
  any variant of untagged enum KeybindingsSpec in `tui.keymap.editor...`", so
  this list was validated against codex-cli 0.155.1 before being written here.

  Caveat that no config can fix: Ctrl+Enter and Enter are the same byte (0x0D)
  in legacy terminal encoding. The binding only has an effect where the terminal
  reports the modifier - win32-input-mode locally, the kitty keyboard protocol
  over SSH. Ctrl+J is still the habit that works everywhere; see docs/terminal.md.

  copy_on_select: Codex's default ("auto") deliberately does NOT copy a mouse
  selection when it runs in Windows Terminal (and Ghostty 1.2+, Kitty on macOS,
  VS Code on Windows), on the assumption that the terminal's own copy-on-select
  covers it. But Codex captures the mouse in its fullscreen UI, so the terminal
  never sees the selection and highlighting copied nothing: only right-click did.
  "always" copies every non-empty transcript selection on release, the same
  highlight-copies contract Windows Terminal, OpenCode (see the profiles) and
  Ghostty give everywhere else. Enum values (codex-rs/config types.rs):
  auto | always | never.

  To force another Codex key, add it to $forced below as "<dotted path>" ->
  "<TOML value>". Anything not listed is left to you and to Codex.
*/ -}}

{{- $forced := dict
      "tui.keymap.editor.insert_newline" `["shift-enter", "ctrl-j", "ctrl-enter", "alt-enter"]`
      "tui.copy_on_select" `"always"`
-}}
{{- /* env.GH_TOKEN, GIT_AUTHOR_NAME/EMAIL and GIT_COMMITTER_NAME/EMAIL: the
       ADR-0038 bot GitHub identity, injected into every subprocess Codex
       spawns via [shell_environment_policy.set] ("Explicit environment
       values injected after exclusions" - the config reference's only
       env-setting mechanism). GH_TOKEN alone only governs `gh` API calls; a
       bare `git commit` in the same session still falls back to
       ~/.gitconfig's [user] (the operator's identity) without the
       GIT_AUTHOR/GIT_COMMITTER pair too - confirmed by a live check on a
       wired machine before these were added. The bot identity is fixed, not
       machine-local data: every wired machine commits as the same single bot
       account. The token comes from the machine-local [data.githubBot]
       config table (never committed); machines without it force nothing
       and this template's behavior is unchanged. */ -}}
{{- if hasKey . "githubBot" -}}
{{-   $forced = merge $forced (dict
        "shell_environment_policy.set.GH_TOKEN" (printf "%q" .githubBot.token)
        "shell_environment_policy.set.GIT_AUTHOR_NAME" `"c20260202"`
        "shell_environment_policy.set.GIT_AUTHOR_EMAIL" `"258988202+c20260202@users.noreply.github.com"`
        "shell_environment_policy.set.GIT_COMMITTER_NAME" `"c20260202"`
        "shell_environment_policy.set.GIT_COMMITTER_EMAIL" `"258988202+c20260202@users.noreply.github.com"`
      ) -}}
{{- end -}}

{{- /* Pre-format every forced "key = value" line once, padded to share its
       table's widest key (docs/invariants.md #15: a block of two+ key = value
       lines shares one "=" column - shell_environment_policy.set now carries
       five). Computed once and reused by both the in-place replace path and
       the end-of-file append path below, so the block stays aligned the same
       way on every apply, not just the render that first writes it. */ -}}
{{- $tableOf := dict -}}
{{- $widths := dict -}}
{{- range $path, $value := $forced -}}
{{-   $parts := splitList "." $path -}}
{{-   $key := last $parts -}}
{{-   $table := join "." (initial $parts) -}}
{{-   $_ := set $tableOf $path $table -}}
{{-   $cur := 0 -}}
{{-   if hasKey $widths $table }}{{ $cur = get $widths $table }}{{ end -}}
{{-   if gt (len $key) $cur }}{{ $_ := set $widths $table (len $key) }}{{ end -}}
{{- end -}}
{{- $lineOf := dict -}}
{{- range $path, $value := $forced -}}
{{-   $parts := splitList "." $path -}}
{{-   $key := last $parts -}}
{{-   $w := get $widths (get $tableOf $path) -}}
{{-   $_ := set $lineOf $path (printf "%-*s = %s" (int $w) $key $value) -}}
{{- end -}}

{{- $raw := .chezmoi.stdin | trimPrefix "\ufeff" -}}
{{- $eol := "\n" -}}
{{- if contains "\r\n" $raw }}{{ $eol = "\r\n" }}{{ end -}}
{{- $lines := splitList "\n" (replace "\r\n" "\n" $raw) -}}

{{- /* header: current [table] we are inside. done: paths already emitted.
       skip: we are swallowing the continuation lines of a replaced multi-line
       array value (a key we replace may legitimately span lines). */ -}}
{{- /* rootdotted: first segments of dotted keys written at the file root
       (tui.x = ...). Such a key already DECLARES that table, so appending a
       [tui] header later is a TOML "cannot declare twice" error. top: lines
       that must therefore be emitted at the root, before any table. */ -}}
{{- $st := dict "header" "" "done" (dict) "skip" false "out" (list) "top" (list) "rootdotted" (dict) -}}

{{- range $lines -}}
{{-   $line := . -}}
{{-   $t := trim $line -}}
{{-   if $st.skip -}}
{{-     if contains "]" $t }}{{ $_ := set $st "skip" false }}{{ end -}}
{{-   else if and (hasPrefix "[" $t) (hasSuffix "]" $t) -}}
{{-     $h := trim (trimSuffix "]" (trimPrefix "[" $t)) -}}
{{-     $_ := set $st "header" $h -}}
{{-     $_ := set $st "out" (append $st.out $line) -}}
{{- /* entering a table that owns a forced key: emit it right after the
           header, before any value Codex or the user put there */ -}}
{{-     range $path, $value := $forced -}}
{{-       $key := $path | trimPrefix (printf "%s." $h) -}}
{{-       if and (ne $key $path) (not (contains "." $key)) (not (hasKey $st.done $path)) -}}
{{-         $_ := set $st "out" (append $st.out (get $lineOf $path)) -}}
{{-         $_ := set $st.done $path true -}}
{{-       end -}}
{{-     end -}}
{{-   else if and (contains "=" $t) (not (hasPrefix "#" $t)) -}}
{{-     $key := trim (first (splitList "=" $t)) -}}
{{-     $path := $key -}}
{{-     if ne $st.header "" }}{{ $path = printf "%s.%s" $st.header $key }}{{ end -}}
{{-     if and (eq $st.header "") (contains "." $key) }}{{ $_ := set $st.rootdotted (first (splitList "." $key)) true }}{{ end -}}
{{-     if hasKey $forced $path -}}
{{- /* an existing setting for a forced key: drop it (and any continuation
             lines of a multi-line array), then emit ours unless already done.
             Un-padded, and $key as parsed - not $lineOf's table-relative form:
             this line may be a root-dotted key (its $key IS the full dotted
             path, e.g. tui.copy_on_select) interleaved with arbitrary
             surrounding content, not a clean block of only forced keys, so
             neither the alignment nor the table-relative key name from
             $lineOf is safe to apply here. */ -}}
{{-       $rest := trim (last (splitList "=" $t)) -}}
{{-       if and (hasPrefix "[" $rest) (not (contains "]" $rest)) }}{{ $_ := set $st "skip" true }}{{ end -}}
{{-       if not (hasKey $st.done $path) -}}
{{-         $_ := set $st "out" (append $st.out (printf "%s = %s" $key (get $forced $path))) -}}
{{-         $_ := set $st.done $path true -}}
{{-       end -}}
{{-     else -}}
{{-       $_ := set $st "out" (append $st.out $line) -}}
{{-     end -}}
{{-   else -}}
{{-     $_ := set $st "out" (append $st.out $line) -}}
{{-   end -}}
{{- end -}}

{{- /* nothing in the file claimed a forced key: append its table at the end.
       Grouped by table first - two forced keys sharing a table (GH_TOKEN and
       the four GIT_AUTHOR/GIT_COMMITTER vars both live under
       shell_environment_policy.set) must share ONE [table] header; emitting
       it once per key is a TOML "cannot declare twice" parse error. */ -}}
{{- $pending := dict -}}
{{- range $path, $value := $forced -}}
{{-   if not (hasKey $st.done $path) -}}
{{-     $parts := splitList "." $path -}}
{{-     if hasKey $st.rootdotted (first $parts) -}}
{{-       $_ := set $st "top" (append $st.top (printf "%s = %s" $path $value)) -}}
{{-     else -}}
{{-       $table := join "." (initial $parts) -}}
{{-       $lines := list -}}
{{-       if hasKey $pending $table }}{{ $lines = get $pending $table }}{{ end -}}
{{-       $_ := set $pending $table (append $lines (get $lineOf $path)) -}}
{{-     end -}}
{{-     $_ := set $st.done $path true -}}
{{-   end -}}
{{- end -}}
{{- range $table, $lines := $pending -}}
{{-   $_ := set $st "out" (append $st.out "") -}}
{{-   $_ := set $st "out" (append $st.out "# Managed by chezmoi (dot_codex/modify_private_config.toml). Edits here are overwritten.") -}}
{{-   $_ := set $st "out" (append $st.out (printf "[%s]" $table)) -}}
{{-   range $lines -}}
{{-     $_ := set $st "out" (append $st.out .) -}}
{{-   end -}}
{{- end -}}

{{- /* join on LF, tidy, then restore the file's own line ending. Collapsing
       runs of blank lines keeps the appended table from drifting a line further
       down each time, on a config that already ended in a newline. */ -}}
{{- $body := join "\n" (concat $st.top $st.out) -}}
{{- $body = regexReplaceAll `\n{3,}` $body "\n\n" -}}
{{- $body = regexReplaceAll `(?s)^\s+|\s+$` $body "" -}}
{{- if eq $eol "\r\n" }}{{ $body = replace "\n" "\r\n" $body }}{{ end -}}
{{- $body }}{{ $eol }}
