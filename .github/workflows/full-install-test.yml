name: Full Install Test

# Real, full package installs across Windows/Linux/macOS - deliberately NOT run on
# every push (unlike ci.yml). This is the only place any package category actually
# gets turned on and verified; every bug found in run_onchange_install_packages.*
# this repo has hit so far (wrong Chocolatey package names, stale Antigravity
# URLs/paths, a stale checksum) was found by a human running a full install by
# hand - this exists so drift like that gets caught automatically instead.
#
# Cron only supports weekly, not biweekly, directly - `check-schedule` below runs
# every Sunday but only lets the platform jobs actually proceed on even ISO weeks,
# approximating "every other Sunday". workflow_dispatch always runs regardless.

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  check-schedule:
    name: Check biweekly schedule
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered - running regardless of week."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            WEEK=$(date +%V)
            if [ $((10#$WEEK % 2)) -eq 0 ]; then
              echo "ISO week $WEEK is even - running this week."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "ISO week $WEEK is odd - skipping, runs every other Sunday."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  full-install-windows:
    name: Full Install (Windows)
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: windows-latest
    # 120, not 90: with every choco install capped at 600s and ScreenRec's
    # own 300s download cap, the realistic worst case for the full
    # ~50-package list lands around 65-75 min - one capped hang away from 90.
    # Unused headroom bills nothing.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create full-install config (all package categories on)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.config\chezmoi" | Out-Null
          @"
          sourceDir = '$env:GITHUB_WORKSPACE'

          [[data.accounts]]
            name = "CI Full Install"
            email = "ci-full-install@example.local"

          [data.packages]
            core = true
            modern_cli = true
            fonts = true
            agent_toolkit = true
            opencode_cli = true
            opencode_desktop = true
            claude_cli = true
            claude_desktop = true
            chatgpt_cli = true
            chatgpt_desktop = true
            antigravity_cli = true
            antigravity_desktop = true
            dev_desktop = true
            remote_access = true
            remote_access_server = false
            # plane enable --all needs an interactive WebAuthn approval that CI
            # cannot complete (exit 2 on non-terminal stdin fails the run by
            # contract) - guardrail is exercised on real machines instead.
            guardrail = false
          "@ | Out-File -FilePath "$env:USERPROFILE\.config\chezmoi\chezmoi.toml" -Encoding utf8

      - name: Run install.ps1 (full install)
        shell: powershell
        env:
          # GitHub Actions always sets CI=true, which makes .chezmoi.toml.tmpl's
          # $interactive false, which makes every package toggle fall through to
          # its hardcoded non-interactive literal (false) - completely ignoring the
          # `true` values pre-seeded above. Confirmed live: the pre-seeded config
          # was silently discarded on the first real run of this workflow. With CI
          # unset, $interactive is true, so promptBoolOnce runs - which finds the
          # pre-seeded answers already present and reuses them without prompting
          # (same "answer already exists" mechanism ci.yml's other jobs rely on),
          # rather than colliding with a real Read-Host hang.
          CI: ""
          # install.ps1 itself also checks $env:CI, separately, to decide whether to
          # skip its OWN Read-Host prompts (the fix for the hang found earlier this
          # session) - unsetting CI above would silently undo that fix too. Set this
          # instead so install.ps1 stays non-interactive regardless of the CI
          # override just above, decoupling the two unrelated things that happened
          # to both key off the same variable.
          CHEZMOI_TEST_MINIMAL: "true"
        run: .\install.ps1

      - name: Verify real installs landed
        shell: powershell
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          $failed = $false

          $expectedCommands = @(
            "git", "chezmoi", "nvim", "rg", "agy", "serena", "graft", "tmux",
            "starship", "zoxide", "direnv", "lazygit", "bat", "eza", "fd", "delta", "gum"
          )
          foreach ($cmd in $expectedCommands) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) {
              Write-Host "  OK: $cmd"
            } else {
              Write-Host "::error::$cmd not found on PATH"
              $failed = $true
            }
          }

          # Get-Command only proves a graft shim exists. This exercises the
          # native tree-sitter modules that have historically failed to build.
          try {
            graft --version 2>&1 | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  OK: graft --version"
            } else {
              Write-Host "::error::graft --version failed (exit $LASTEXITCODE)"
              $failed = $true
            }
          } catch {
            Write-Host "::error::graft --version failed: $_"
            $failed = $true
          }

          # tmux is psmux's alias (the native Windows tmux). agy is the
          # Antigravity CLI; the 2.0 desktop app is checked below.

          # Claude Desktop: uninstall-registry entry (the desktop app; Claude
          # Code is a CLI, checked via Get-Command above, and registers no
          # ARP entry today).
          $claudeReg = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "Claude" }
          if ($claudeReg) {
            Write-Host "  OK: Claude Desktop"
          } else {
            Write-Host "::error::Claude Desktop not found in uninstall registry"
            $failed = $true
          }

          # ChatGPT Work/Codex: current msstore/winget appx package. The
          # similarly named ChatGPT Classic is a separate legacy product.
          $gptPkg = $null
          try { $gptPkg = Get-AppxPackage -Name "OpenAI.Codex" -ErrorAction SilentlyContinue } catch {}
          if ($gptPkg) {
            Write-Host "  OK: ChatGPT Work/Codex"
          } else {
            Write-Host "::error::ChatGPT Work/Codex appx package not found"
            $failed = $true
          }

          # Antigravity 2.0 (hub): 3-proof check (path / registry / choco).
          $agExe = "$env:LOCALAPPDATA\Programs\Antigravity\Antigravity.exe"
          $agReg = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "Antigravity*" -and $_.DisplayName -notlike "*IDE*" }
          $agChoco = (choco list --exact antigravity 2>$null | Select-String "^antigravity\s")
          if ((Test-Path $agExe) -or $agReg -or $agChoco) {
            Write-Host "  OK: Antigravity 2.0"
          } else {
            Write-Host "::error::Antigravity 2.0 not found (path, registry, and choco list all empty)"
            $failed = $true
          }

          # OpenCode Desktop: choco `opencode-desktop` in the capped loop.
          $ocReg = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*", "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "OpenCode*" }
          if ($ocReg) {
            Write-Host "  OK: OpenCode Desktop"
          } else {
            Write-Host "::error::OpenCode Desktop not found in uninstall registry"
            $failed = $true
          }

          $chromeExe = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          if (Test-Path $chromeExe) {
            Write-Host "  OK: Google Chrome"
          } else {
            Write-Host "::error::Google Chrome not found at $chromeExe"
            $failed = $true
          }

          if ($failed) { exit 1 }
          Write-Host "All expected installs verified."
          # Explicit success exit: this step's fresh PowerShell process
          # auto-loads the profile installed moments ago, whose native init
          # commands (starship/zoxide/direnv) can leave $LASTEXITCODE non-zero
          # - and the Actions runner treats that stale value as the step
          # result, failing a fully successful verify. Same class PR #16
          # fixed in install.ps1 and ci.yml's config-patch step.
          exit 0

  full-install-linux:
    name: Full Install (Linux)
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create full-install config (all package categories on)
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml << 'EOF'
          [[data.accounts]]
            name = "CI Full Install"
            email = "ci-full-install@example.local"

          [data.packages]
            core = true
            modern_cli = true
            fonts = true
            agent_toolkit = true
            opencode_cli = true
            opencode_desktop = true
            claude_cli = true
            claude_desktop = true
            chatgpt_cli = true
            chatgpt_desktop = true
            antigravity_cli = true
            antigravity_desktop = true
            dev_desktop = true
            remote_access = true
            remote_access_server = false
            # plane enable --all needs an interactive WebAuthn approval that CI
            # cannot complete (exit 2 on non-terminal stdin fails the run by
            # contract) - guardrail is exercised on real machines instead.
            guardrail = false
          EOF

      - name: Install Xvfb (so install_desktop is real coverage, not a silent no-op)
        run: |
          # install_linux_desktop() only runs if $DISPLAY is set - a plain headless
          # runner would make install_desktop=true test nothing at all.
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run install.sh under a virtual display (full install)
        env:
          # GitHub Actions always sets CI=true, which makes .chezmoi.toml.tmpl's
          # $interactive false, which makes every package toggle fall through to
          # its hardcoded non-interactive literal (false) - completely ignoring the
          # `true` values pre-seeded above. Confirmed live on the first real run of
          # this workflow. With CI unset, $interactive is true, so promptBoolOnce
          # runs - which finds the pre-seeded answers already present and reuses
          # them without prompting. install.sh itself has no CI-gated prompts of
          # its own (unlike install.ps1), so nothing else needs decoupling here.
          CI: ""
        run: |
          xvfb-run -a sh install.sh

      - name: Verify real installs landed
        run: |
          FAILED=0
          check() {
            if command -v "$1" &>/dev/null; then
              echo "  OK: $1"
            else
              echo "::error::$1 not found on PATH"
              FAILED=1
            fi
          }
          for cmd in git chezmoi nvim rg agy serena graft starship zoxide direnv lazygit bat eza fd delta gum; do
            check "$cmd"
          done

          # agy is the Antigravity CLI. Claude/ChatGPT Desktop have no
          # official Linux builds (the installer info-skips by design) -
          # nothing to check for them here. Antigravity 2.0 installs from
          # the hub tarball; OpenCode Desktop from the .deb.

          if [ -d "$HOME/.local/share/antigravity-2.0" ] && find "$HOME/.local/share/antigravity-2.0" -maxdepth 2 -type f -perm -u+x | grep -q .; then
            echo "  OK: Antigravity 2.0 (extracted with executables)"
          else
            echo "::error::Antigravity 2.0 not found at ~/.local/share/antigravity-2.0"
            FAILED=1
          fi

          # The .deb registers as package "opencode" (not opencode-desktop),
          # binary at /opt/OpenCode/ai.opencode.desktop with an alternatives
          # link at /usr/bin/ai.opencode.desktop (observed live on the
          # 2026-09-14 CI run).
          if dpkg -s opencode &>/dev/null || command -v ai.opencode.desktop &>/dev/null || [ -d /opt/OpenCode ]; then
            echo "  OK: OpenCode Desktop"
          else
            echo "::error::OpenCode Desktop not found (dpkg, binary, or /opt/OpenCode)"
            FAILED=1
          fi

          if command -v google-chrome &>/dev/null; then
            echo "  OK: google-chrome"
          else
            echo "::error::google-chrome not found on PATH"
            FAILED=1
          fi

          exit $FAILED

  full-install-macos:
    name: Full Install (macOS)
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create full-install config (all package categories on)
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml << 'EOF'
          [[data.accounts]]
            name = "CI Full Install"
            email = "ci-full-install@example.local"

          [data.packages]
            core = true
            modern_cli = true
            fonts = true
            agent_toolkit = true
            opencode_cli = true
            opencode_desktop = true
            claude_cli = true
            claude_desktop = true
            chatgpt_cli = true
            chatgpt_desktop = true
            antigravity_cli = true
            antigravity_desktop = true
            dev_desktop = true
            remote_access = true
            remote_access_server = false
            # plane enable --all needs an interactive WebAuthn approval that CI
            # cannot complete (exit 2 on non-terminal stdin fails the run by
            # contract) - guardrail is exercised on real machines instead.
            guardrail = false
          EOF

      - name: Run install.sh (full install)
        env:
          # See the matching comment in the Linux job - GitHub Actions' CI=true
          # collapses every package toggle to its non-interactive default (false),
          # ignoring the pre-seeded config above, unless CI is overridden here so
          # promptBoolOnce reuses the pre-seeded answers instead.
          CI: ""
        run: sh install.sh

      - name: Verify real installs landed
        run: |
          FAILED=0
          check() {
            if command -v "$1" &>/dev/null; then
              echo "  OK: $1"
            else
              echo "::error::$1 not found on PATH"
              FAILED=1
            fi
          }
          for cmd in git chezmoi nvim rg agy serena graft starship zoxide direnv lazygit bat eza fd delta gum; do
            check "$cmd"
          done

          # agy is the Antigravity CLI; the three AI desktop apps install
          # via brew casks / the 2.0 dmg:

          for app in "Claude" "ChatGPT" "OpenCode"; do
            if [ -d "/Applications/$app.app" ]; then
              echo "  OK: $app Desktop"
            else
              echo "::error::$app Desktop not found in /Applications"
              FAILED=1
            fi
          done

          if [ -d "/Applications/Antigravity.app" ]; then
            echo "  OK: Antigravity 2.0"
          else
            echo "::error::Antigravity 2.0 not found in /Applications"
            FAILED=1
          fi

          if [ -d "/Applications/Google Chrome.app" ]; then
            echo "  OK: Google Chrome"
          else
            echo "::error::Google Chrome not found in /Applications"
            FAILED=1
          fi

          exit $FAILED
