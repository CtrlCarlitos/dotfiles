name: Auto Update Versions

on:
  schedule:
    # Run every Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run version updater script
        run: |
          chmod +x scripts/update-versions.sh
          ./scripts/update-versions.sh

      - name: Create Pull Request with Updates
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # A PAT, not the default GITHUB_TOKEN: PRs authored via GITHUB_TOKEN don't
          # trigger other workflows (ci.yml's pull_request trigger), so every prior
          # auto-update PR merged with zero CI validation ever having run on it.
          token: ${{ secrets.DOTFILES_UPDATER_PAT }}
          # main requires signed commits. Commit through the GitHub API so the
          # commit is signed by GitHub; a local git commit from the runner is
          # unsigned and the merge is refused (Auto Update Versions #3).
          sign-commits: true
          commit-message: "chore: auto-update software versions"
          branch: "chore/auto-update-versions"
          delete-branch: true
          title: "chore: Auto-Update Software Versions"
          body: |
            This PR is auto-generated by a GitHub Action.
            It fetches the latest versions for:
            - **Chezmoi** (via GitHub Release API)
            - **Antigravity 2.0** (hub channel; mac/Linux pin URL-checked,
              Windows floats via Chocolatey)
            - **agent-guardrails** (stable GitHub release only; all supported
              platform binaries and `SHA256SUMS` must be present)

            *(Node.js remains pinned to v24 - see the comment in
            scripts/update-versions.sh for where the pin lives.)*

      - name: Wait for CI, merge only if green
        # 'updated' matters as much as 'created': if an earlier run left the
        # PR open (e.g. its checks failed), later runs UPDATE that same PR -
        # gating only on 'created' meant every later run went green while the
        # update PR rotted unmerged forever.
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          # The PAT, not GITHUB_TOKEN, for the same reason as PR creation
          # above: a merge performed by GITHUB_TOKEN does not trigger push
          # workflows, so the bump would land on main with no CI run at all.
          GH_TOKEN: ${{ secrets.DOTFILES_UPDATER_PAT }}
        run: |
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"
          echo "Waiting for checks on PR #$PR_NUMBER..."

          # Deliberately not using `gh pr checks --watch`: verified live that it
          # gives up well before ci.yml's slowest job actually finishes (its
          # Windows Installer Test alone takes ~10 minutes; --watch returned
          # failure after ~20 seconds total, with no documented timeout to tune
          # around). Poll real per-check state via --json instead and decide
          # pass/fail ourselves once nothing is left pending.
          MAX_WAIT_SECONDS=$((45 * 60))
          INTERVAL=20
          ELAPSED=0
          ITER=0
          JSON="[]"

          # NOTE: a previous run of this step got stuck "in progress" for 20+
          # minutes after all checks had genuinely finished - manually running the
          # exact same `gh pr checks --json` command from a separate authenticated
          # session returned correct, complete data immediately. Root cause was
          # never confirmed (the leading theory - that a non-zero exit code from
          # `gh pr checks` was discarding valid JSON via the old `|| echo '[]'`
          # fallback - was directly tested and disproven: --json mode exits 0
          # regardless of pass/fail). This logging exists to catch it for real if
          # it recurs, rather than guessing again. Also added: explicit --repo
          # (this step's token differs from the one that created the PR, in case
          # that's related to whatever caused the stall) and separating "gh pr
          # checks produced no output at all" from "produced valid JSON that
          # happens to show a failure" more explicitly than the exit-code-based
          # fallback did before.
          while :; do
            ITER=$((ITER + 1))
            set +e
            RAW=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json bucket,name 2>&1)
            CHECKS_EXIT=$?
            set -e
            if [ -n "$RAW" ] && echo "$RAW" | jq empty 2>/dev/null; then
              JSON="$RAW"
            elif [[ "$RAW" == "no checks reported"* ]]; then
              JSON='[]'
            else
              echo "::error::gh pr checks failed: $RAW"
              exit 1
            fi
            TOTAL=$(echo "$JSON" | jq 'length')
            # Only "pending" is actually unfinished. "skipping" is a TERMINAL
            # bucket (check concluded as skipped) - counting it as pending made
            # the loop poll a finished check set for the full 45 minutes and
            # then fail a job whose checks were all done.
            PENDING=$(echo "$JSON" | jq '[.[] | select(.bucket == "pending")] | length')
            echo "[iter $ITER $(date -u +%H:%M:%S)] gh pr checks exit=$CHECKS_EXIT total=$TOTAL pending=$PENDING"
            echo "  raw: $RAW"
            if [ "$TOTAL" -gt 0 ] && [ "$PENDING" -eq 0 ]; then
              break
            fi
            ELAPSED=$((ELAPSED + INTERVAL))
            if [ "$ELAPSED" -ge "$MAX_WAIT_SECONDS" ]; then
              echo "::error::Checks on PR #$PR_NUMBER did not finish within ${MAX_WAIT_SECONDS}s - leaving it open for manual review."
              exit 1
            fi
            sleep "$INTERVAL"
          done

          FAILED=$(echo "$JSON" | jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length')
          if [ "$FAILED" -eq 0 ]; then
            echo "All checks passed - merging."
            gh pr merge --squash --delete-branch --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
          else
            echo "::error::$FAILED check(s) failed on PR #$PR_NUMBER - leaving it open for manual review instead of merging blind."
            exit 1
          fi
