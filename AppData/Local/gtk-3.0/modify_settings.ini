{{- /* chezmoi:modify-template */ -}}
{{- /* GTK 3 settings for Windows GTK apps (Geany). Merged, not owned: other GTK
     tools write their own keys here. Forces only the dark preference, so Geany's
     chrome matches the Catppuccin Mocha terminal and VS Code. Body:
     .chezmoitemplates/ini-force. */ -}}
{{- includeTemplate "ini-force" (dict "stdin" .chezmoi.stdin "section" "Settings" "key" "gtk-application-prefer-dark-theme" "sep" " = " "value" "true") -}}
