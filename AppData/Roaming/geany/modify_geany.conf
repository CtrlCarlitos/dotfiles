{{- /* chezmoi:modify-template */ -}}
{{- /* Geany rewrites geany.conf on every exit, so it is merged, never owned
     (docs/invariants.md #3). Forces only the editor color scheme, i.e. what
     View > Change Color Scheme writes. "dark" is bundled with Geany: #1e1e1e,
     VS Code's dark editor background, and within a shade of the terminal's
     Catppuccin Mocha #1E1E2E. Body: .chezmoitemplates/ini-force. */ -}}
{{- includeTemplate "ini-force" (dict "stdin" .chezmoi.stdin "section" "geany" "key" "color_scheme" "sep" "=" "value" "dark.conf") -}}
